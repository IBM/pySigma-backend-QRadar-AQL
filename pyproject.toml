[tool.poetry]
name = "pySigma-backend-QRadar-AQL"
version = "0.3.2"
description = "pySigma QRadarAQL backend"
authors = ["IBM <noaakless@gmail.com>"]
license = "MIT"
repository = "https://github.com/IBM/pySigma-backend-QRadar-AQL"
packages = [
    { include = "sigma" }
]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
pysigma = ">=0.9.8, <0.12.0"
regex = "^2023.12.25"
# Security floors for transitive dependencies (pysigma -> requests -> ...)
requests = ">=2.33.0"
urllib3 = ">=2.8.0"
certifi = ">=2026.10.18"
idna = ">=3.15"

[tool.poetry.dev-dependencies]
pytest = "^9.0.3"
pytest-cov = "^4.0.0"
coverage = "^7.2.5"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
